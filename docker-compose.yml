# ═══════════════════════════════════════════════════════════════
# Gene Curator - Infrastructure Services
# ═══════════════════════════════════════════════════════════════
#
# Shared infrastructure used by both hybrid and full Docker modes.
# Contains only database and cache services.
#
# Usage:
#   docker compose up -d                          # Infrastructure only (hybrid mode)
#   docker compose -f ... -f docker-compose.dev.yml up  # Full dev mode
#   docker compose -f ... -f docker-compose.prod.yml up # Production mode
#
# ═══════════════════════════════════════════════════════════════

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_CONTAINER:-gene_curator_postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gene_curator_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "${POSTGRES_PORT:-5454}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-gene_curator_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gene_curator_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER:-gene_curator_redis}
    ports:
      - "${REDIS_PORT:-6399}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gene_curator_network

volumes:
  dev_postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  gene_curator_network:
    driver: bridge
