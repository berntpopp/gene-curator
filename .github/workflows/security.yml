name: Dependency audit

# Known-vulnerability scan of both lockfiles. Static analysis (bandit, zizmor) runs in CI.
on:
  pull_request:
    paths: [backend/uv.lock, frontend/package-lock.json, .github/workflows/security.yml]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC: catches advisories published after merge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make audit-backend

  node:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: make audit-frontend
