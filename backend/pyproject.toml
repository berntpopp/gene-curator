[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gene-curator-backend"
version = "0.10.1"
description = "Schema-agnostic genetic curation platform backend"
authors = [{name = "Gene Curator Team", email = "team@gene-curator.org"}]
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy[asyncio]>=2.1.4",  # 2.1 no longer pulls in greenlet; the async engine needs it
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pydantic[email]>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyJWT>=2.14.0",
    "bcrypt>=4.0",
    "python-multipart>=0.0.31",
    "httpx>=0.25.2",
    "pyyaml>=6.0.1",
    "defusedxml>=0.7.1",
    # "jsonschema>=4.0.0",  # temporarily disabled
    "cryptography>=44.0.0",
    "fastmcp>=3.4.7,<4.0.0",  # MCP server over the existing routes (#462)
    "mcp>=1.30.0",  # transitive via fastmcp; floor pins the CVE fix outside the lock
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.6",
    "mypy>=1.7.1",
    "bandit>=1.7.5",
    "pip-audit>=2.6.0",
    "types-defusedxml>=0.7.0",
    "httpx2>=2.16.0",  # Starlette TestClient backend (httpx is deprecated there)
]

[project.urls]
Homepage = "https://github.com/halbritter-lab/gene-curator"
Documentation = "https://gene-curator.readthedocs.io"
Repository = "https://github.com/halbritter-lab/gene-curator.git"
"Bug Tracker" = "https://github.com/halbritter-lab/gene-curator/issues"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit
    "T20", # flake8-print
    "SIM", # flake8-simplify
    # "LOG", # flake8-logging (requires --preview)
    "RUF", # Ruff-specific rules
    "TID", # banned APIs (see flake8-tidy-imports below)
]
ignore = [
    "E501",  # line too long (handled by formatter) 
    "S101",  # use of assert (allowed in tests)
    "S104",  # possible binding to all interfaces
    "B008",  # do not perform function calls in argument defaults (FastAPI depends)
    "S110",  # try-except-pass (sometimes needed for optional imports)
    "N805",  # first argument naming (false positive for class methods with cls)
    "UP046", "UP047",  # PEP 695 generics: migrate CRUDBase/decorators deliberately, not via autofix
    "UP042",  # (str, Enum) -> StrEnum changes str() of DB-stored enums; migrate deliberately
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106", "S608", "T201"]
"scripts/*" = ["T201"]
"app/core/logging/*" = ["TID251"]  # the logging layer wraps stdlib logging
"alembic/*" = ["E402"]
"app/core/logging/performance.py" = ["C901"]  # Performance decorators are inherently complex
"app/services/validators/*" = ["C901"]  # Validators have complex API response parsing logic

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging.getLogger".msg = "Use app.core.logging.get_logger (AGENTS.md)"

[tool.ruff.lint.isort]
known-first-party = ["app"]
force-single-line = false
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "jwt.*",
    "jsonschema.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "app.core.logging.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[[tool.mypy.overrides]]
module = "app.models.*"
# SQLAlchemy models have complex typing that's difficult to fully satisfy
warn_return_any = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "app.crud.*"
# CRUD modules interact heavily with SQLAlchemy models
warn_return_any = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "app.api.*"
# API modules have complex FastAPI dependencies
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "app.services.validators.*"
# Validators interact with external APIs and have complex Pydantic models
disallow_untyped_calls = false
warn_return_any = false

[tool.pytest.ini_options]
minversion = "6.0"
# PostgreSQL-only tests (RLS, triggers) run in their own lane: `make test-postgres`
addopts = "-ra -q --strict-markers --strict-config -m 'not postgres'"
testpaths = ["tests"]
# New Pydantic v1-style APIs in app code must fail CI (#330)
filterwarnings = ["error::pydantic.warnings.PydanticDeprecatedSince20:app"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "postgres: needs the real PostgreSQL schema from database/sql (RLS, triggers)",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
# Ratchet floor: raise as coverage grows, never lower (target 90%, AGENTS.md)
fail_under = 91
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
