events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        # The edge proxy (NPM) reaches this container over a private network: take the client IP
        # from its X-Forwarded-For, then hand the backend one clean address (it trusts only us).
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        # Same-origin API: /api, the MCP server and its OAuth endpoints go to the backend.
        # Resolved per request (Docker DNS), so nginx starts and survives backend restarts.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        # MCP streams responses: pass them through as they come
        proxy_buffering off;
        client_max_body_size 20m;

        location /api/ { proxy_pass $backend; }
        location = /mcp { proxy_pass $backend; }
        location /mcp/ { proxy_pass $backend; }
        location = /authorize { proxy_pass $backend; }
        location = /token { proxy_pass $backend; }
        location /.well-known/ { proxy_pass $backend; }
        location = /health { proxy_pass $backend; }

        # /register is two things: the SPA page (GET) and MCP client registration (POST)
        location = /register {
            error_page 418 = @backend;
            if ($request_method = POST) { return 418; }
            try_files /index.html =404;
        }
        location @backend { proxy_pass $backend; }

        # Handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache static assets. An add_header here drops the server-level ones, so repeat them.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}