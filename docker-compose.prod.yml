# ═══════════════════════════════════════════════════════════════
# Gene Curator - Production Environment
# ═══════════════════════════════════════════════════════════════
#
# Extends infrastructure (docker-compose.yml) with production
# backend and frontend services. No volume mounts, no reload.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up
#
# Or use Makefile:
#   make prod        # Start production stack
#   make prod-build  # Build and start
#
# Note: For true production deployments, consider overriding
# the PostgreSQL port in your .env to avoid external exposure,
# or use a dedicated production docker-compose.yml without ports.
#
# ═══════════════════════════════════════════════════════════════

services:
  # ───────────────────────────────────────────────────────────────
  # FastAPI Backend (Production)
  # ───────────────────────────────────────────────────────────────
  backend:
    container_name: ${BACKEND_CONTAINER:-gene_curator_backend}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://app_user:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gene_curator_dev}}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      SECRET_KEY: ${SECRET_KEY:-change_me_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # LLM key ring (see .env.example); unset, LLM credentials fail closed
      LLM_CREDENTIAL_KEYS: ${LLM_CREDENTIAL_KEYS:-}
      LLM_CREDENTIAL_ACTIVE_KID: ${LLM_CREDENTIAL_ACTIVE_KID:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-[]}
      # MCP OAuth (#462): the HTTPS API origin clients reach and the web app origin
      GENE_CURATOR_PUBLIC_URL: ${GENE_CURATOR_PUBLIC_URL:?Set GENE_CURATOR_PUBLIC_URL (https://api host)}
      GENE_CURATOR_FRONTEND_URL: ${GENE_CURATOR_FRONTEND_URL:?Set GENE_CURATOR_FRONTEND_URL (https://web app host)}
      # Rate limiting is off in config/api.yaml (dev, tests) and on in production
      GENE_CURATOR_API__FEATURES__ENABLE_RATE_LIMITING: "true"
      # Passed through only when set. Set it to your reverse proxy's address only, and bind
      # BACKEND_PORT to 127.0.0.1 when a proxy is in front; unset, X-Forwarded-For is ignored
      FORWARDED_ALLOW_IPS:
    ports:
      - "${BACKEND_PORT:-8051}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"] # slim image has no curl
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - gene_curator_network

  # ───────────────────────────────────────────────────────────────
  # Vue 3 + Nginx Frontend (Production)
  # ───────────────────────────────────────────────────────────────
  frontend:
    container_name: ${FRONTEND_CONTAINER:-gene_curator_frontend}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8051}
    ports:
      - "${FRONTEND_PORT:-3051}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - gene_curator_network
