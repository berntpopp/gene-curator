name: CI

# Every job calls the same `make` target developers run locally (`make ci` = all of them).
# Cost model: verify locally, CI confirms once. Draft PRs run nothing (mark ready to test), there
# is no second run on master after merge, and work is packed into two heavy jobs because each
# job bills a rounded-up minute plus setup.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE: origin/${{ github.base_ref || 'master' }} # diff-cover: changed lines vs the PR base
  UV_FROZEN: '1' # a stale uv.lock fails instead of being re-locked silently

jobs:
  changes:
    name: Changes + repo rules
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files via the API
    outputs:
      # A manual run checks everything
      backend: ${{ steps.filter.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend: ['backend/**', 'database/**', 'scripts/**', 'Makefile', '.github/workflows/ci.yml', 'frontend/src/types/api.generated.ts']
            frontend: ['frontend/**', 'scripts/**', 'Makefile', '.github/workflows/ci.yml', '.nvmrc']
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: make ci-repo

  backend:
    name: Backend (lint, types, SQLite + PostgreSQL tests, coverage)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: cd backend && uv sync --extra dev --frozen
      - run: make ci-backend
      - run: make test-postgres
      - run: make diff-cover

  frontend:
    name: Frontend (lint, types, tests, coverage, build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: make ci-frontend
      - run: make diff-cover

  gate:
    # The single required status check: passes only if every job passed or was skipped.
    name: CI gate
    needs: [changes, backend, frontend]
    if: ${{ always() && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [[ $r == success || $r == skipped ]] || exit 1; done
