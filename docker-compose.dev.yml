# ═══════════════════════════════════════════════════════════════
# Gene Curator - Full Development Environment
# ═══════════════════════════════════════════════════════════════
#
# Extends infrastructure (docker-compose.yml) with backend and
# frontend services for full Docker development with hot reload.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Or use Makefile:
#   make dev        # Start all services
#   make dev-build  # Build and start
#
# ═══════════════════════════════════════════════════════════════

services:
  # ───────────────────────────────────────────────────────────────
  # FastAPI Backend (Development)
  # ───────────────────────────────────────────────────────────────
  backend:
    container_name: ${BACKEND_CONTAINER:-gene_curator_backend}
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://app_user:${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-gene_curator_dev}}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-true}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      SECRET_KEY: ${SECRET_KEY:-dev_secret_key_change_in_production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # LLM key ring (see .env.example); unset, LLM credentials fail closed
      LLM_CREDENTIAL_KEYS: ${LLM_CREDENTIAL_KEYS:-}
      LLM_CREDENTIAL_ACTIVE_KID: ${LLM_CREDENTIAL_ACTIVE_KID:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:3051","http://localhost:5193"]}
    ports:
      - "${BACKEND_PORT:-8051}:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"] # slim image has no curl
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    command: ["/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    networks:
      - gene_curator_network

  # ───────────────────────────────────────────────────────────────
  # Vue 3 + Vite Frontend (Development)
  # ───────────────────────────────────────────────────────────────
  frontend:
    container_name: ${FRONTEND_CONTAINER:-gene_curator_frontend}
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "${FRONTEND_PORT:-3051}:3000"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8051}
      VITE_APP_TITLE: ${VITE_APP_TITLE:-Gene Curator (Dev)}
      VITE_ENVIRONMENT: ${VITE_ENVIRONMENT:-development}
      DOCKER_POLLING: ${DOCKER_POLLING:-true}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 3000
    networks:
      - gene_curator_network

# ───────────────────────────────────────────────────────────────
# Development Volumes
# ───────────────────────────────────────────────────────────────
volumes:
  backend_venv:
    driver: local
