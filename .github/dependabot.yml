version: 2
# Weekly grouped updates keep PR noise low; security updates ignore the schedule and open immediately.
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: weekly, day: monday, time: '07:00', timezone: Europe/Berlin }
    cooldown: { default-days: 3 }
    groups:
      python-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: '07:00', timezone: Europe/Berlin }
    cooldown: { default-days: 3 }
    groups:
      npm-dev:
        dependency-type: development
        update-types: [minor, patch]
      npm-prod:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: '07:00', timezone: Europe/Berlin }
    cooldown: { default-days: 3 }
    groups:
      actions: { patterns: ['*'] }
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: monday, time: '07:00', timezone: Europe/Berlin }
    cooldown: { default-days: 3 }
