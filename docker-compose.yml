# ═══════════════════════════════════════════════════════════════
# Gene Curator - Infrastructure Services
# ═══════════════════════════════════════════════════════════════
#
# Shared infrastructure used by both hybrid and full Docker modes.
# Contains only the database service.
#
# Usage:
#   docker compose up -d                          # Infrastructure only (hybrid mode)
#   docker compose -f ... -f docker-compose.dev.yml up  # Full dev mode
#   docker compose -f ... -f docker-compose.prod.yml up # Production mode
#
# ═══════════════════════════════════════════════════════════════

services:
  # PostgreSQL Database
  postgres:
    # Pinned by digest (also scripts/test-postgres.sh); bump both together
    image: postgres:15-alpine@sha256:54e0dd8e8cddcdbb9156c2486eed5a43eccb7214d7c6828097d41ce049fb3984
    container_name: ${POSTGRES_CONTAINER:-gene_curator_postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gene_curator_dev}
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_HOST_AUTH_METHOD: md5
      # Read by migration 031 (runtime role app_user); no default on purpose.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD for the app_user role}
    ports:
      - "${POSTGRES_PORT:-5454}:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - ./database/sql:/docker-entrypoint-initdb.d
      # Dev logins (admin123), loaded by 999_dev_fixtures.sh; docker/docker-compose.npm.yml drops both mounts
      - ./database/fixtures:/docker-entrypoint-fixtures:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-gene_curator_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gene_curator_network


volumes:
  dev_postgres_data:
    driver: local

networks:
  gene_curator_network:
    driver: bridge
